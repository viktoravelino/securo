# Deploys frontend/ to the securo app on the maintainer's Dokku host when `dokku` changes.
# The runner joins the tailnet as `tag:ci` to reach it.
name: Deploy web

on:
  push:
    branches: [dokku]
    paths:
      - frontend/**
      - .github/workflows/deploy-web.yml
  workflow_dispatch:

concurrency:
  group: deploy-securo-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: dokku/github-action@v1.10.0
        with:
          git_remote_url: ssh://dokku@192.168.2.13:22/securo
          ssh_private_key: ${{ secrets.DOKKU_DEPLOY_KEY }}
          branch: main
